[project]
name = "intelligent-search-platform"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.8,<3.9",  # Local query segmentation; no external NLP API

    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "typesense>=0.21.0",
    "voyageai>=0.3.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "redis[hiredis]>=5.0.0",
    "cachetools>=5.3.0",
    "py-mini-racer>=0.6.0",
    "hvac>=2.0.0",       # HashiCorp Vault client — used when SECRET_PROVIDER=vault
    "boto3>=1.34.0",     # AWS SDK — used when SECRET_PROVIDER=aws
    "google-auth>=2.0.0",                    # Service account credential loading for Google APIs
    "google-api-python-client>=2.0.0",       # Google Sheets REST API client (sheets v4)
    "PyJWT>=2.8.0",                          # JWT sign/verify for OAuth2 admin sessions
    # Chat providers — imported lazily so a missing package only fails when that provider is used
    "anthropic>=0.40.0",                     # Anthropic Claude (paid)
    "openai>=1.50.0",                        # OpenAI + Groq + self-hosted (OpenAI-compat)
    "google-genai>=1.0.0",                   # Google Gemini (paid) — replaces deprecated google-generativeai
    "scikit-learn>=1.4.0",                   # Trained re-scorer (Case A) — imported lazily, see popularity_trainer.py
    "numpy>=1.26.0",                         # scikit-learn dependency, also imported lazily
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isp"]
