version: "3.9"

networks:
  isp-net:
    name: isp-net

services:
  typesense:
    image: typesense/typesense:0.25.2
    container_name: typesense
    ports:
      - "8108:8108"
    volumes:
      - isp-typesense-data:/data
    command: >
      --data-dir /data
      --api-key local-dev-key-change-me
      --enable-cors
    networks:
      - isp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use Socket; socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\")); connect(S,sockaddr_in(8108,inet_aton(\"127.0.0.1\"))) or exit 1; exit 0'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  isp-redis:
    image: redis:7-alpine
    container_name: isp-redis
    ports:
      - "6379:6379"
    volumes:
      - isp-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - isp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  isp-db:
    image: postgres:16-alpine
    container_name: isp-db
    environment:
      POSTGRES_DB: isp
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp-dev-password
    ports:
      - "5432:5432"
    volumes:
      - isp-db-data:/var/lib/postgresql/data
    networks:
      - isp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d isp"]
      interval: 5s
      timeout: 5s
      retries: 10

  isp-api:
    build:
      context: ./backend
    container_name: isp-api
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    depends_on:
      isp-db:
        condition: service_healthy
      typesense:
        condition: service_healthy
      isp-redis:
        condition: service_healthy
    networks:
      - isp-net
    restart: unless-stopped

  isp-ui:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: http://localhost:8001/v1
    container_name: isp-ui
    ports:
      - "3001:80"
    depends_on:
      - isp-api
    networks:
      - isp-net
    restart: unless-stopped

volumes:
  isp-db-data:
  isp-typesense-data:
  isp-redis-data:
